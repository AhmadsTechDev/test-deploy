# =====================================================================
#  Konfigurasi nginx untuk proyek Todo
#  nginx di sini memegang 3 peran sekaligus:
#    1. WEB SERVER     -> menyajikan file hasil build React (HTML/CSS/JS)
#    2. REVERSE PROXY  -> meneruskan request /api/... ke backend Elysia
#    3. LOAD BALANCER  -> membagi request /api/... ke 2 instance backend
# =====================================================================

# --- [3] LOAD BALANCER -------------------------------------------------
# "upstream" adalah daftar server tujuan. nginx akan membagi request
# ke server-server ini. Defaultnya bergantian (round robin):
#   request 1 -> backend1, request 2 -> backend2, request 3 -> backend1, ...
#
# "backend1" dan "backend2" adalah nama service di docker-compose.yml.
# Docker otomatis mengubah nama itu menjadi IP container-nya.
upstream backend {
    # least_conn;              # coba aktifkan: pilih server yang paling sedikit koneksinya
    server backend1:3000;      # coba tambah "weight=3": backend1 dapat 3x lebih banyak request
    server backend2:3000;
}

server {
    listen 80;
    server_name _;             # _ artinya terima nama domain apa pun

    # --- [1] WEB SERVER ------------------------------------------------
    # Folder berisi hasil "npm run build" (disalin di frontend/Dockerfile)
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Cari file yang diminta. Kalau tidak ada, kirim index.html.
        # Ini penting untuk aplikasi React (SPA) supaya refresh halaman tidak 404.
        try_files $uri $uri/ /index.html;
    }

    # --- [2] REVERSE PROXY ---------------------------------------------
    # Semua request yang diawali /api/ TIDAK dilayani nginx sendiri,
    # tapi diteruskan ke upstream "backend" di atas.
    location /api/ {
        proxy_pass http://backend;

        # Header ini memberi tahu backend info asli dari browser,
        # karena dari sudut pandang backend, yang menghubunginya adalah nginx.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tampilkan alamat backend yang dipilih nginx di response header
        # (lihat di DevTools browser -> tab Network -> Headers)
        add_header X-Upstream $upstream_addr always;
    }
}
